<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blue Sport - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #030303;
            --accent-primary: #0055EF;
            --text-secondary: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image:
                radial-gradient(ellipse at 50% 50%, rgba(0, 85, 239, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse at 30% 70%, rgba(0, 85, 239, 0.06) 0%, transparent 50%);
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 0 35px rgba(0, 85, 239, 0.7));
            animation: pulse 2.8s ease-in-out infinite;
            margin-bottom: 24px;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 35px rgba(0, 85, 239, 0.7));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 55px rgba(0, 85, 239, 1));
            }
        }

        .coming-soon {
            font-size: 17px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #80b3ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .site-footer {
            width: 100%;
            padding: 20px 16px;
            text-align: center;
            background: var(--bg-primary);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }
        .site-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 700;
        }
        .site-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        <img class="logo" src="https://i.postimg.cc/kGmCkdn1/20260607-170253.png" alt="Blue Sport Logo">
        <div class="coming-soon">Coming Soon</div>
    </div>

    <footer class="site-footer">
        جميع الحقوق محفوظة لـ <a href="https://t.me/blue_sport_tv" target="_blank">Team Blue Sport</a>
    </footer>
</body>
</html>
